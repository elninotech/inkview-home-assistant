refresh:
  name: Refresh now
  description: >
    Recompute the total-energy sensor immediately instead of waiting for
    the next 5-minute tick.

rotate_secret:
  name: Rotate shared secret
  description: >
    Generate a brand-new shared secret, which also starts a new one-year
    link. The old secret stops working immediately, so InkView must be
    re-linked: an admin copies the new secret from the InkView sidebar
    panel ("Connect to InkView") into the InkView app.

revoke_all_tokens:
  name: Revoke all bearer tokens
  description: >
    Invalidate every outstanding bearer token without changing
    the shared secret. The InkView side can re-authenticate immediately
    using the same secret. Use this if a leaked token is suspected.

extend_link:
  name: Extend link by one year
  description: >
    Keep the current shared secret working for another year from now.
    Rotating the secret instead (a new link) is the safer choice.
